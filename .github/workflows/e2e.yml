name: E2E Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Setup runtime
        id: runtime
        uses: savvy-web/workflow-runtime-action@main
      - run: pnpm vitest run --project="*:e2e"
